name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Your deployed backend URL (https://..., must end with /). Leave empty to use the placeholder."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            gradle assembleDebug --no-daemon -PAPI_BASE_URL="$API_BASE_URL"
          else
            gradle assembleDebug --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: creator-donate-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
